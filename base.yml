# oc-githooks/base.yml — Outcode base git hooks (all repos)
# v3 — validated by execution (lefthook 2.1.10, gitleaks 8.21.2). Commit + push matrices green.
# Distributed via Lefthook `remotes`, version-pinned. Do not fork per-repo.

min_version: 1.7.0
assert_lefthook_installed: true

output:
  - summary
  - failure

# ---------------------------------------------------------------------------
# Protected branches (single source of truth — reconcile per plan §5.3).
# Enforced at BOTH commit (no direct commits) and push (no direct/ remapped push).
# ---------------------------------------------------------------------------

pre-commit:
  parallel: true
  commands:

    secret-scan:
      run: |
        if ! command -v gitleaks >/dev/null 2>&1; then
          echo "✗ gitleaks is not installed — required for secret scanning."
          echo "  Install: brew install gitleaks   (see oc-githooks/README)"
          exit 1
        fi
        gitleaks git --staged --verbose --redact --no-banner
      skip:
        - merge
        - rebase

    secret-file-guard:
      glob: "*"
      run: |
        blocked=$(printf '%s\n' {staged_files} \
          | grep -E '(^|/)\.env($|\.)|\.(pem|p12|pfx|key|keystore|jks)$|(^|/)id_rsa$|service-account.*\.json$|\.tfstate(\.backup)?$|(^|/)\.npmrc$|(^|/)\.pypirc$' \
          | grep -Ev '\.env\.(example|sample|template|dist)$' || true)
        if [ -n "$blocked" ]; then
          echo "✗ Refusing to commit secret/credential/state files:"; echo "$blocked"
          echo "  Add to .gitignore; store secrets in AWS Secrets Manager / GitHub Secrets."
          exit 1
        fi

    large-file-guard:
      glob: "*"
      run: |
        max=5242880; fail=0
        for f in {staged_files}; do
          [ -f "$f" ] || continue
          sz=$(git cat-file -s ":$f" 2>/dev/null || wc -c < "$f")
          if [ "${sz:-0}" -gt "$max" ]; then
            echo "✗ $f is $((sz/1024/1024))MB (>5MB) — use Git LFS for binaries."; fail=1
          fi
        done
        [ "$fail" -eq 0 ]

    merge-conflict-markers:
      glob: "*"
      run: |
        if grep -HnE '^(<<<<<<< |>>>>>>> )' {staged_files}; then
          echo "✗ Merge conflict markers found — resolve before committing."; exit 1
        fi

    # Auto-fix trailing whitespace + ensure a single final newline (text files only).
    # Portable across macOS/Linux (perl + tail trick, no GNU-specific sed -i).
    normalize-whitespace:
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,py,dart,tf,tfvars,md,json,yml,yaml,toml,css,scss,html,sh,txt,sql,env}"
      run: |
        for f in {staged_files}; do
          [ -f "$f" ] || continue
          perl -i -pe 's/[ \t]+$//' "$f"
          if [ -s "$f" ] && [ -n "$(tail -c1 "$f")" ]; then printf '\n' >> "$f"; fi
        done
      stage_fixed: true

    protected-branch-guard:
      run: |
        b=$(git symbolic-ref --short -q HEAD || echo DETACHED)
        case "$b" in
          develop|stage|staging|prod|main)
            echo "✗ Direct commits to '$b' are blocked."
            echo "  Branch as feature/<TASKID>-desc and open a PR (Governance SOP §7.2)."
            exit 1 ;;
        esac

commit-msg:
  commands:

    conventional-commit:
      skip:
        - merge
        - rebase
      run: |
        subject=$(head -1 "{1}")
        case "$subject" in
          "Merge "*|"Revert "*|"Revert \""*|"fixup! "*|"squash! "*) exit 0 ;;
        esac
        echo "$subject" | grep -qE '^(feat|fix|chore|docs|refactor|perf|test|build|ci|revert)(\([a-z0-9 ._/-]+\))?!?: .+' || {
          echo "✗ Commit subject must follow Conventional Commits: <type>(scope): description"
          echo "  types: feat|fix|chore|docs|refactor|perf|test|build|ci|revert"
          echo "  got:  $subject"
          exit 1; }

    subject-length:
      run: |
        len=$(head -1 "{1}" | wc -c)
        if [ "$len" -gt 73 ]; then
          echo "⚠ Commit subject is $((len-1)) chars (>72 recommended). Keep it concise."
        fi

    clickup-task-id:
      run: |
        if ! grep -qiE '[A-Z]{2,}-[0-9]+|app\.clickup\.com/t/' "{1}"; then
          echo "⚠ No ClickUp task ID in the message (e.g. ENS-123) — status automation won't link this commit."
        fi

    no-ai-coauthor:
      run: |
        if grep -qiE 'co-authored-by:[[:space:]]*claude' "{1}"; then
          echo "✗ Remove the 'Co-Authored-By: Claude' trailer (Outcode policy)."; exit 1
        fi

pre-push:
  # Sequential: the protected-branch guard must be the sole consumer of git's
  # pre-push stdin (the ref list). priority:1 makes it run first.
  parallel: false
  commands:

    protected-branch-push-guard:
      priority: 1
      use_stdin: true
      run: |
        protected="develop stage staging prod main"; status=0
        while read -r lref lsha rref rsha; do
          [ -z "$rref" ] && continue
          rb=${rref#refs/heads/}
          for p in $protected; do
            if [ "$rb" = "$p" ]; then
              echo "✗ Direct push to protected branch '$rb' is blocked — promote via PR (Governance SOP §7.2)."
              status=1
            fi
          done
        done
        exit $status

    no-wip-fixup-push:
      priority: 2
      run: |
        bad=$(git log HEAD --not --remotes --format='%s' 2>/dev/null | grep -iE '^(wip\b|fixup!|squash!)' || true)
        if [ -n "$bad" ]; then
          echo "✗ Clean up WIP / fixup! / squash! commits before pushing:"; echo "$bad"
          echo "  Use: git rebase -i --autosquash"
          exit 1
        fi

    branch-name:
      priority: 3
      run: |
        b=$(git symbolic-ref --short -q HEAD || echo DETACHED)
        case "$b" in develop|stage|staging|prod|main|DETACHED) exit 0 ;; esac
        echo "$b" | grep -qE '^(feature|fix|chore|hotfix)/[A-Z]{2,}-[0-9]+' || {
          echo "⚠ Branch '$b' should be <type>/<TASKID>-desc (feature|fix|chore|hotfix), e.g. feature/ENS-123-waitlist."
        }
