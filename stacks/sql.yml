# oc-githooks/stacks/sql.yml — SQL overlay (cross-cutting; add alongside a language stack)
# Requires a .sqlfluff config specifying your dialect (e.g. dialect = postgres).
pre-commit:
  commands:
    sql-format:
      glob: "*.sql"
      run: sqlfluff fix {staged_files}
      stage_fixed: true
    sql-lint:
      glob: "*.sql"
      run: sqlfluff lint {staged_files}
