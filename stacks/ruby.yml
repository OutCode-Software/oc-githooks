# oc-githooks/stacks/ruby.yml — Ruby / Rails overlay (merges onto base.yml)
pre-commit:
  commands:
    ruby-lint:
      # `rubocop -A` auto-corrects AND still exits non-zero on remaining offenses,
      # so a single command does format + lint. A separate non-fixing lint command
      # would race the auto-fix under pre-commit `parallel: true` and false-block.
      glob: "*.rb"
      run: bundle exec rubocop -A {staged_files}
      stage_fixed: true
    ruby-no-debug:
      glob: "*.rb"
      run: |
        if grep -HnE '(^|[^A-Za-z0-9_.])(binding\.(pry|irb)|byebug|debugger)\b' {staged_files}; then
          echo "✗ Remove debugger statements (binding.pry/byebug/debugger) before committing."; exit 1
        fi
pre-push:
  parallel: false
  commands:
    ruby-test:
      # RSpec with SimpleCov; fails if line coverage < 25%.
      # SimpleCov must be enabled so it writes coverage/.last_run.json (its default).
      run: |
        bundle exec rspec || exit 1
        if [ -f coverage/.last_run.json ]; then
          pct=$(ruby -rjson -e 'r=JSON.parse(File.read("coverage/.last_run.json"))["result"]; puts (r["line"]||r["covered_percent"]||0).to_i')
          if [ "${pct:-0}" -lt 25 ]; then echo "✗ Line coverage ${pct}% is below the 25% minimum. Add tests."; exit 1; fi
          echo "✓ Coverage ${pct}% (>=25%)"
        else
          echo "⚠ No SimpleCov report found — add SimpleCov to enforce coverage."
        fi
