# Copy to .github/workflows/hooks.yml in each repo.
# The authoritative, un-bypassable mirror of the local hooks (defense-in-depth):
# local hooks give fast feedback; this runs the same checks server-side so
# `git commit --no-verify` only delays a failure, never avoids it.
name: git-hooks-mirror

on:
  pull_request:
  push:
    branches: [develop, stage, staging, prod, main]

jobs:
  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # full history for the secret scan

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install lefthook + gitleaks
        run: |
          npm install -g lefthook
          GL=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GL}/gitleaks_${GL}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Full-history secret scan
        run: gitleaks git --redact --verbose

      - name: Run hooks over all files
        run: |
          lefthook run pre-commit --all-files --force
          lefthook run commit-msg  --all-files --force || true
          lefthook run pre-push    --all-files --force
