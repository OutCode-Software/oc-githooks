# oc-githooks/base.yml — Outcode base git hooks (all repos)
# v6 — implements docs/GIT-FLOW-POLICY.md. Validated by tests/run.sh (lefthook 2.2.1).
# Distributed via Lefthook `remotes`, version-pinned. Do not fork per-repo.

min_version: 2.0.0
assert_lefthook_installed: true

output:
  - summary
  - failure

# ---------------------------------------------------------------------------
# Protected branches: main and develop (Git Flow policy §1).
# Enforced at commit (protected-branch-guard below) and at push
# (.lefthook/pre-push/ref-guard.sh, which also checks branch and tag names).
# ---------------------------------------------------------------------------

pre-commit:
  parallel: true
  commands:

    secret-scan:
      run: |
        if ! command -v gitleaks >/dev/null 2>&1; then
          echo "✗ gitleaks is not installed — required for secret scanning."
          echo "  Install: brew install gitleaks   (see oc-githooks/README)"
          exit 1
        fi
        gitleaks git --staged --verbose --redact --no-banner
      skip:
        - merge
        - rebase

    secret-file-guard:
      glob: "*"
      run: |
        blocked=$(printf '%s\n' {staged_files} \
          | grep -E '(^|/)\.env($|\.)|\.(pem|p12|pfx|key|keystore|jks)$|(^|/)id_rsa$|service-account.*\.json$|\.tfstate(\.backup)?$|(^|/)\.npmrc$|(^|/)\.pypirc$' \
          | grep -Ev '\.env\.(example|sample|template|dist)$' || true)
        if [ -n "$blocked" ]; then
          echo "✗ Refusing to commit secret/credential/state files:"; echo "$blocked"
          echo "  Add to .gitignore; store secrets in AWS Secrets Manager / GitHub Secrets."
          exit 1
        fi

    large-file-guard:
      glob: "*"
      run: |
        max=5242880; fail=0
        for f in {staged_files}; do
          [ -f "$f" ] || continue
          sz=$(git cat-file -s ":$f" 2>/dev/null || wc -c < "$f")
          if [ "${sz:-0}" -gt "$max" ]; then
            echo "✗ $f is $((sz/1024/1024))MB (>5MB) — use Git LFS for binaries."; fail=1
          fi
        done
        [ "$fail" -eq 0 ]

    merge-conflict-markers:
      glob: "*"
      run: |
        if grep -HnE '^(<<<<<<< |>>>>>>> )' {staged_files}; then
          echo "✗ Merge conflict markers found — resolve before committing."; exit 1
        fi

    # Auto-fix trailing whitespace + ensure a single final newline (text files only).
    # Portable across macOS/Linux (perl + tail trick, no GNU-specific sed -i).
    normalize-whitespace:
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,py,dart,tf,tfvars,md,json,yml,yaml,toml,css,scss,html,sh,txt,sql,env}"
      run: |
        for f in {staged_files}; do
          [ -f "$f" ] || continue
          perl -i -pe 's/[ \t]+$//' "$f"
          if [ -s "$f" ] && [ -n "$(tail -c1 "$f")" ]; then printf '\n' >> "$f"; fi
        done
      stage_fixed: true

    protected-branch-guard:
      run: |
        b=$(git symbolic-ref --short -q HEAD || echo DETACHED)
        case "$b" in
          main|develop)
            echo "✗ Direct commits to '$b' are blocked."
            echo "  Branch from develop as CU-<clickup-id> and open a PR (Git Flow policy §2)."
            exit 1 ;;
        esac

prepare-commit-msg:
  commands:

    # Stamps every commit, including `--no-verify` ones (prepare-commit-msg still runs):
    #   OC-Hooks: <version>  — the daily audit flags commits without it (hooks not installed)
    #   ClickUp: CU-<id>     — from the branch name, so the task keeps its commit history
    #                          even after the branch is squash-merged and deleted
    trailers:
      run: |
        git interpret-trailers --in-place --if-exists replace --trailer "OC-Hooks: v6.1.0" "{1}"
        b=$(git symbolic-ref --short -q HEAD || true)
        if printf '%s\n' "$b" | grep -qE '^CU-[0-9a-z]+$'; then
          git interpret-trailers --in-place --if-exists replace --trailer "ClickUp: $b" "{1}"
        fi

commit-msg:
  commands:

    conventional-commit:
      skip:
        - merge
        - rebase
      run: |
        subject=$(head -1 "{1}")
        case "$subject" in
          "Merge "*|"Revert "*|"Revert \""*|"fixup! "*|"squash! "*) exit 0 ;;
        esac
        echo "$subject" | grep -qE '^(feat|fix|chore|docs|refactor|perf|test|build|ci|revert)(\([a-z0-9 ._/-]+\))?!?: .+' || {
          echo "✗ Commit subject must follow Conventional Commits: <type>(scope): description"
          echo "  types: feat|fix|chore|docs|refactor|perf|test|build|ci|revert"
          echo "  got:  $subject"
          exit 1; }

    subject-length:
      run: |
        len=$(head -1 "{1}" | wc -c)
        if [ "$len" -gt 73 ]; then
          echo "⚠ Commit subject is $((len-1)) chars (>72 recommended). Keep it concise."
        fi

    no-ai-coauthor:
      run: |
        if grep -qiE 'co-authored-by:[[:space:]]*claude' "{1}"; then
          echo "✗ Remove the 'Co-Authored-By: Claude' trailer (Outcode policy)."; exit 1
        fi

pre-push:
  # Sequential, so a rejected ref fails the push before any stack runs its tests.
  parallel: false

  # The ref guard is a script (.lefthook/pre-push/ref-guard.sh), not a command:
  # Lefthook skips pre-push *commands* when a push changes no files, which let
  # tag pushes, branch deletions and empty commits past the old guard.
  # It is the sole consumer of git's pre-push stdin (the ref list).
  scripts:
    "ref-guard.sh":
      runner: sh
      priority: 1
      use_stdin: true

  commands:

    no-wip-fixup-push:
      priority: 2
      run: |
        bad=$(git log HEAD --not --remotes --format='%s' 2>/dev/null | grep -iE '^(wip\b|fixup!|squash!)' || true)
        if [ -n "$bad" ]; then
          echo "✗ Clean up WIP / fixup! / squash! commits before pushing:"; echo "$bad"
          echo "  Use: git rebase -i --autosquash"
          exit 1
        fi
