# oc-githooks/stacks/node.yml — Node.js / NestJS backend overlay (merges onto base.yml)
pre-commit:
  commands:
    node-format:
      glob: "*.{ts,js,mjs,cjs,json}"
      run: npx --no-install prettier --write {staged_files}
      stage_fixed: true
    node-lint:
      glob: "*.{ts,js,mjs,cjs}"
      run: npx --no-install eslint --fix {staged_files}
      stage_fixed: true
    node-no-debugger:
      glob: "*.{ts,js,mjs,cjs}"
      run: |
        if grep -HnE '(^|[^A-Za-z0-9_])debugger([^A-Za-z0-9_]|$)' {staged_files}; then
          echo "✗ Remove 'debugger' statements before committing."; exit 1
        fi
    node-no-focused-tests:
      glob: "*.{test,spec}.{ts,js}"
      run: |
        if grep -HnE '\b(describe|it|test|context)\.only\b' {staged_files}; then
          echo "✗ Remove .only from tests — it silently skips the rest of the suite."; exit 1
        fi
pre-push:
  parallel: false
  commands:
    node-typecheck:
      run: npx --no-install tsc --noEmit
    node-test:
      # Runner is auto-detected: Vitest if the repo has it, otherwise Jest. Both enforce the
      # same line-coverage floor (OC_MIN_COVERAGE, default 90). Override the detection with
      # OC_TEST_RUNNER=vitest|jest when a repo has both installed.
      run: |
        runner="${OC_TEST_RUNNER:-}"
        if [ -z "$runner" ]; then
          if   [ -x node_modules/.bin/vitest ]; then runner=vitest
          elif [ -x node_modules/.bin/jest   ]; then runner=jest
          fi
        fi
        min="${OC_MIN_COVERAGE:-90}"
        case "$runner" in
          vitest)
            npx --no-install vitest run --coverage --coverage.thresholds.lines="$min"
            ;;
          jest)
            npx --no-install jest --coverage --coverageReporters=json-summary --passWithNoTests || exit 1
            node -e 'const min=+(process.env.OC_MIN_COVERAGE||90); const p=require("./coverage/coverage-summary.json").total.lines.pct; if(p<min){console.error("✗ Line coverage "+p+"% is below the "+min+"% minimum. Add tests.");process.exit(1)} console.log("✓ Coverage "+p+"% (>="+min+"%)")'
            ;;
          *)
            echo "✗ No test runner found. Install dependencies first (npm ci), or add vitest"
            echo "  or jest to devDependencies. Have both? Set OC_TEST_RUNNER=vitest|jest."
            exit 1
            ;;
        esac
