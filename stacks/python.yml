# oc-githooks/stacks/python.yml — Python / FastAPI overlay (merges onto base.yml)
pre-commit:
  commands:
    py-format:
      glob: "*.py"
      run: ruff format {staged_files}
      stage_fixed: true
    py-lint:
      glob: "*.py"
      run: ruff check --fix {staged_files}
      stage_fixed: true
    py-no-debug:
      glob: "*.py"
      run: |
        if grep -HnE '(^|[^#].*)\b(breakpoint\(\)|import[[:space:]]+i?pdb|i?pdb\.set_trace\(\))' {staged_files}; then
          echo "✗ Remove debugger statements (breakpoint()/pdb) before committing."; exit 1
        fi
pre-push:
  parallel: false
  commands:
    py-typecheck:
      glob: "*.py"
      run: mypy .
    py-test:
      # `--cov=.` measures ALL source (incl. untested files); bare `--cov` only
      # measures imported modules, so untested files would be invisible to the gate.
      # Coverage source defaults to `.` (flat services); Django / apps-layout repos set
      # OC_COV_SOURCE=apps. Floor defaults to 25%; raise per-repo with OC_MIN_COVERAGE.
      # Both are set centrally by oc-hooks and overridable per-repo (see docs/INSTALL.md).
      run: pytest -x -q --cov=${OC_COV_SOURCE:-.} --cov-fail-under=${OC_MIN_COVERAGE:-25}
