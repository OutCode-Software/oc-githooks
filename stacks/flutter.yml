# oc-githooks/stacks/flutter.yml — Flutter / Dart overlay (merges onto base.yml)
pre-commit:
  commands:
    dart-format:
      glob: "*.dart"
      run: dart format {staged_files}
      stage_fixed: true
    dart-analyze-staged:
      glob: "*.dart"
      run: dart analyze {staged_files}
    dart-no-print:
      glob: "*.dart"
      run: |
        if grep -HnE '(^|[^A-Za-z0-9_.])print\(' {staged_files}; then
          echo "⚠ Avoid print() in Flutter — prefer debugPrint()/a logger (avoid_print)."
        fi
pre-push:
  parallel: false
  commands:
    flutter-analyze:
      run: flutter analyze
    flutter-test:
      # Unit tests must pass and cover >=25% of lines (bar rises over time).
      run: |
        flutter test --coverage
        pct=$(awk -F: '/^LF:/{f+=$2} /^LH:/{h+=$2} END{if(f==0)print 0; else printf "%d",(h*100)/f}' coverage/lcov.info)
        if [ "${pct:-0}" -lt 25 ]; then
          echo "✗ Line coverage ${pct}% is below the 25% minimum."
          echo "  Add tests. Inspect: genhtml coverage/lcov.info -o coverage/html && open coverage/html/index.html"
          exit 1
        fi
        echo "✓ Coverage ${pct}% (>=25%)"
