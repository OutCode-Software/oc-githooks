# Copy this file to your repository root as: lefthook.yml
# Then copy base.yml -> .githooks/base.yml and stacks/swift.yml -> .githooks/stacks/swift.yml
# (or run scripts/install-into-repo.sh swift /path/to/your/repo)
#
# NOTE: this copy/`extends` method is the FALLBACK (use only if 'remotes' is unreachable).
# The recommended default is the 'remotes' block — auto-updates, no committed .githooks/.
# See docs/INSTALL.md Option B, or run: scripts/adopt-remotes.sh <stack> /path/to/repo
extends:
  - .githooks/base.yml
  - .githooks/stacks/swift.yml
