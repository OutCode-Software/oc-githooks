# oc-githooks/stacks/web.yml — Next.js / TypeScript overlay (merges onto base.yml)
pre-commit:
  commands:
    web-format:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,json,css,scss,md}"
      run: |
        if [ ! -x node_modules/.bin/prettier ]; then
          # A new repo with no JS/TS source yet has nothing to check: pass with a note.
          [ -z "$(git ls-files -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.cjs' ':!:*.config.*' ':!:*.d.ts' ':!:.*' | head -1)" ] && { echo "• prettier not installed, no JS/TS source yet: web-format skipped"; exit 0; }
          echo "✗ prettier is not installed here. Run: npm ci"; exit 1
        fi
        node_modules/.bin/prettier --write {staged_files}
      stage_fixed: true
    web-lint:
      glob: "*.{ts,tsx,js,jsx}"
      run: |
        if [ ! -x node_modules/.bin/eslint ]; then
          # A new repo with no JS/TS source yet has nothing to check: pass with a note.
          [ -z "$(git ls-files -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.cjs' ':!:*.config.*' ':!:*.d.ts' ':!:.*' | head -1)" ] && { echo "• eslint not installed, no JS/TS source yet: web-lint skipped"; exit 0; }
          echo "✗ eslint is not installed here. Run: npm ci"; exit 1
        fi
        node_modules/.bin/eslint --fix {staged_files}
      stage_fixed: true
    web-no-debugger:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs}"
      run: |
        if grep -HnE '(^|[^A-Za-z0-9_])debugger([^A-Za-z0-9_]|$)' {staged_files}; then
          echo "✗ Remove 'debugger' statements before committing."; exit 1
        fi
    web-no-focused-tests:
      glob: "*.{test,spec}.{ts,tsx,js,jsx}"
      run: |
        if grep -HnE '\b(describe|it|test|context)\.only\b' {staged_files}; then
          echo "✗ Remove .only from tests — it silently skips the rest of the suite."; exit 1
        fi
pre-push:
  parallel: false
  commands:
    web-typecheck:
      run: |
        # Nothing to check in a project with no TypeScript source yet (a new repo): pass with a note.
        if [ -z "$(git ls-files -- '*.ts' '*.tsx' ':!:*.config.*' ':!:*.d.ts' ':!:.*' | head -1)" ]; then
          echo "• no TypeScript source yet: web-typecheck skipped"; exit 0
        fi
        # NOT `npx tsc`: the npm package named "tsc" is an abandoned 2016 release
        # of the compiler, so when a repo's deps are missing npx resolves the
        # squatter instead of the project's TypeScript.
        [ -x node_modules/.bin/tsc ] || { echo "✗ typescript is not installed here. Run: npm ci"; exit 1; }
        node_modules/.bin/tsc --noEmit
    web-test:
      # Coverage floor defaults to 80% (set centrally by oc-hooks); override per-repo
      # with OC_MIN_COVERAGE (see docs/INSTALL.md). Full run so the gate is meaningful.
      run: |
        # Nothing to check in a project with no JS/TS source yet (a new repo): pass with a note.
        if [ -z "$(git ls-files -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.cjs' ':!:*.config.*' ':!:*.d.ts' ':!:.*' | head -1)" ]; then
          echo "• no JS/TS source yet: web-test skipped"; exit 0
        fi
        [ -x node_modules/.bin/vitest ] || { echo "✗ vitest is not installed here. Run: npm ci"; exit 1; }
        node_modules/.bin/vitest run --coverage --coverage.thresholds.lines=${OC_MIN_COVERAGE:-90}
