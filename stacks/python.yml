# oc-githooks/stacks/python.yml — Python / Django / FastAPI overlay (merges onto base.yml)
pre-commit:
  commands:
    py-format:
      glob: "*.py"
      run: ruff format {staged_files}
      stage_fixed: true
    py-lint:
      glob: "*.py"
      run: ruff check --fix {staged_files}
      stage_fixed: true
    py-no-debug:
      glob: "*.py"
      run: |
        if grep -HnE '(^|[^#].*)\b(breakpoint\(\)|import[[:space:]]+i?pdb|i?pdb\.set_trace\(\))' {staged_files}; then
          echo "✗ Remove debugger statements (breakpoint()/pdb) before committing."; exit 1
        fi
pre-push:
  parallel: false
  commands:
    py-typecheck:
      glob: "*.py"
      # Type-checking is OPT-IN: it runs only when the repo has a mypy config. Bare `mypy .`
      # on an untyped codebase (most Django repos) emits a wall of missing-stub errors and
      # blocks every push, so an unconfigured repo self-skips with a hint instead.
      # Enable by adding a [tool.mypy] section (pyproject.toml) or a [mypy] one (setup.cfg).
      run: |
        if [ -z "${OC_PY_RUNNER:-}" ] && ! command -v mypy >/dev/null 2>&1; then
          echo "• mypy not installed — skipping type-check (add mypy + [tool.mypy] to enable)."
          exit 0
        fi
        if ! grep -qsE '\[tool\.mypy\]|\[mypy\]' pyproject.toml mypy.ini setup.cfg .mypy.ini 2>/dev/null; then
          echo "• no mypy config — skipping type-check (add [tool.mypy] to enable)."
          exit 0
        fi
        ${OC_PY_RUNNER:-} mypy .
    py-test:
      # `--cov=<src>` measures ALL source (incl. untested files); bare `--cov` only
      # measures imported modules, so untested files would be invisible to the gate.
      # Source auto-detects the Django apps-layout (`apps/` present) so the gate measures
      # app packages, not migrations/settings; flat services keep `.`. Override per-repo
      # with OC_COV_SOURCE. Floor defaults to 90%; raise per-repo with OC_MIN_COVERAGE.
      # Docker-first repos (tools + DB live in the container, not on the laptop) set
      # OC_PY_RUNNER once to prefix both pre-push commands; empty default = run on the host.
      # All three are overridable per-repo (see docs/INSTALL.md).
      run: |
        SRC="${OC_COV_SOURCE:-$([ -d apps ] && echo apps || echo .)}"
        ${OC_PY_RUNNER:-} pytest -x -q --cov="$SRC" --cov-fail-under="${OC_MIN_COVERAGE:-90}"
