# oc-githooks/stacks/python.yml — Python / FastAPI overlay (merges onto base.yml)
pre-commit:
  commands:
    py-format:
      glob: "*.py"
      run: ruff format {staged_files}
      stage_fixed: true
    py-lint:
      glob: "*.py"
      run: ruff check --fix {staged_files}
      stage_fixed: true
    py-no-debug:
      glob: "*.py"
      run: |
        if grep -HnE '(^|[^#].*)\b(breakpoint\(\)|import[[:space:]]+i?pdb|i?pdb\.set_trace\(\))' {staged_files}; then
          echo "✗ Remove debugger statements (breakpoint()/pdb) before committing."; exit 1
        fi
pre-push:
  parallel: false
  commands:
    py-typecheck:
      glob: "*.py"
      run: mypy .
    py-test:
      # `--cov=.` measures ALL source (incl. untested files); bare `--cov` only
      # measures imported modules, so untested files would be invisible to the gate.
      # Coverage floor defaults to 25% (set centrally by oc-hooks); a repo can raise
      # its own bar by setting OC_MIN_COVERAGE (see docs/INSTALL.md).
      run: pytest -x -q --cov=. --cov-fail-under=${OC_MIN_COVERAGE:-25}
