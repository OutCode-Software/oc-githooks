# oc-githooks/stacks/laravel.yml — Laravel (PHP) overlay (merges onto base.yml)
# Uses Laravel Pint (formatter) + Larastan/PHPStan + `php artisan test`.
pre-commit:
  commands:
    laravel-format:
      glob: "*.php"
      run: ./vendor/bin/pint {staged_files}
      stage_fixed: true
    laravel-no-debug:
      glob: "*.php"
      run: |
        if grep -HnE '(^|[^A-Za-z0-9_>])(dd|dump|ray|var_dump)\(' {staged_files}; then
          echo "✗ Remove debug helpers (dd/dump/ray/var_dump) — they leak output/halt requests."; exit 1
        fi
pre-push:
  parallel: false
  commands:
    laravel-analyse:
      run: |
        # Nothing to check in a project with no PHP source yet (a new repo): pass with a note.
        if [ -z "$(git ls-files -- '*.php' | head -1)" ]; then
          echo "• no PHP source yet: laravel-analyse skipped"; exit 0
        fi
        ./vendor/bin/phpstan analyse --no-progress
    laravel-test:
      # Coverage floor defaults to 80% (set centrally by oc-hooks); override per-repo
      # with OC_MIN_COVERAGE (see docs/INSTALL.md). Needs pcov/xdebug.
      run: |
        # Nothing to check in a project with no PHP source yet (a new repo): pass with a note.
        if [ -z "$(git ls-files -- '*.php' | head -1)" ]; then
          echo "• no PHP source yet: laravel-test skipped"; exit 0
        fi
        php artisan test --coverage --min=${OC_MIN_COVERAGE:-90}
